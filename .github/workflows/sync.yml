name: Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # incremental every 15 min
    - cron: '0 7 * * *'      # full sync + match every morning at 7am UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync mode'
        required: true
        default: 'incremental'
        type: choice
        options: [full, incremental, match]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run incremental sync (every 15 min)
        if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'incremental')
        run: npx tsx src/cli.ts incremental
        env:
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HCP_API_KEY:               ${{ secrets.HCP_API_KEY }}
          GHL_API_TOKEN:             ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}

      - name: Run full sync (nightly)
        if: github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npx tsx src/cli.ts full
        env:
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HCP_API_KEY:               ${{ secrets.HCP_API_KEY }}
          GHL_API_TOKEN:             ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}

      - name: Run match only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'match'
        run: npx tsx src/cli.ts match
        env:
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HCP_API_KEY:               ${{ secrets.HCP_API_KEY }}
          GHL_API_TOKEN:             ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID:           ${{ secrets.GHL_LOCATION_ID }}
